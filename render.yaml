# Render Blueprint: 백엔드(FastAPI) 웹 서비스
# Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 아래 설정으로 서비스가 만들어진다.
# sync: false 인 값은 만들 때 Render가 직접 입력을 받는다 (비밀 키를 저장소에 넣지 않기 위해).
services:
  - type: web
    name: esp32-iot-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
